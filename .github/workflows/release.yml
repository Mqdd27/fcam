name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: VERSION=${GITHUB_REF_NAME#v} ./build.sh
      - run: fcam.app/Contents/MacOS/fcam --selftest
      - name: Build DMG (app + Applications shortcut for drag-install)
        run: |
          mkdir dmg && cp -R fcam.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname fcam -srcfolder dmg -format UDZO fcam.dmg
      - run: gh release create "$GITHUB_REF_NAME" fcam.dmg --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
