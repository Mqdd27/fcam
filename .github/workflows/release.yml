name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: VERSION=${GITHUB_REF_NAME#v} ./build.sh
      - run: fcam.app/Contents/MacOS/fcam --selftest
      - run: ditto -c -k --keepParent fcam.app fcam.zip
      - run: gh release create "$GITHUB_REF_NAME" fcam.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
